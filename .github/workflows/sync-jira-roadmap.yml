name: Sync Jira public roadmap

# Webhook-driven sync. Deliberately has NO `schedule:` trigger.
#
# GitHub auto-disables *scheduled* workflows after 60 days without a pushed
# commit, and that disable applies to the whole workflow file — every trigger
# in it, not just the cron. Keeping the Jira-driven path in its own
# schedule-free file means it can never be caught by that.
#
# The periodic full reconcile lives in reconcile-jira-roadmap.yml.

on:
  workflow_dispatch:
    inputs:
      jira_issue_key:
        description: "Epic key (e.g. SPX-12). Leave empty for full JQL reconcile."
        required: false
        type: string

  repository_dispatch:
    types: [jira-roadmap-sync]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Sync Jira → GitHub Issues + Project
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.ROADMAP_SYNC_GITHUB_TOKEN }}
          JIRA_GITHUB_USER_MAP: ${{ secrets.JIRA_GITHUB_USER_MAP }}
          ROADMAP_SYNC_CONFIG: roadmap-sync.yaml
          JIRA_ISSUE_KEY: ${{ github.event.client_payload.issue_key || github.event.inputs.jira_issue_key || '' }}
        run: python scripts/sync_jira_roadmap.py
