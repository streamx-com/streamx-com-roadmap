name: Reconcile Jira public roadmap

# Weekly safety-net reconcile (full JQL sweep), plus the keepalive pull request
# that stops GitHub from auto-disabling this workflow after 60 days of no commits.
#
# This is the only workflow in the repo with a `schedule:` trigger, so it is
# the only one that can ever be auto-disabled — and the keepalive step exists
# to make sure that does not happen.

on:
  schedule:
    - cron: "0 3 * * 0"   # weekly, Sunday 03:00 UTC

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Full reconcile (Jira → GitHub Issues + Project)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.ROADMAP_SYNC_GITHUB_TOKEN }}
          JIRA_GITHUB_USER_MAP: ${{ secrets.JIRA_GITHUB_USER_MAP }}
          ROADMAP_SYNC_CONFIG: roadmap-sync.yaml
          JIRA_ISSUE_KEY: ""   # empty ⇒ full JQL reconcile
        run: python scripts/sync_jira_roadmap.py

      # Runs even when the reconcile above fails: a broken sync must not be
      # allowed to let the workflow lapse into the 60-day auto-disable.
      - name: Keepalive pull request
        if: always()
        env:
          # 30, not 45: this step is evaluated weekly, so a 30-day gate commits
          # around day 35 and leaves ~25 days of slack before GitHub's 60-day
          # cutoff — enough to absorb several dropped scheduled runs.
          KEEPALIVE_AFTER_DAYS: "30"
          GH_TOKEN: ${{ github.token }}
        run: scripts/keepalive-roadmap-workflow.sh
